- id: friends-of-the-lake-district
  order: 1
  name: Friends of the Lake District
  url: https://www.friendsofthelakedistrict.org.uk
  domain: friendsofthelakedistrict.org.uk
  sector: Charity
  summary: Reusable blocks and content tools for campaigns, advocacy pages and member resources, so staff can publish without developer help.
  engagement: hiyield
  images:
    - src: ../assets/clients/friends-of-the-lake-district-home.jpg
      alt: "The Friends of the Lake District home page: two walkers on a Cumbrian hillside, under the headline Protecting Cumbria's landscapes, for nature, for people, for ever."
    - src: ../assets/clients/friends-of-the-lake-district-inner.jpg
      alt: The Our Work page on the Friends of the Lake District website, with volunteers planting hedgerow trees behind the headline.
  caseStudy:
    title: The home page hero
    body:
      - I built almost all of this site, including the hero block at the top of the home page. It's a small block, but it shows how I work, from a Figma design through to content the client can edit.
      - The Figma design was tailored to Tailwind's values, so I could match it 1:1 without translating anything. Details outside the standard scale, like the angled gradient over the photo, went in as exact arbitrary values.
      - The block is built in PHP with its content in Advanced Custom Fields, so it's edited in the WordPress CMS rather than in code.
      - On phones the hero swaps to a separate portrait photo rather than cropping the landscape one, so the people stay in frame. The cost is a second image to prepare, and in return the design holds up at both sizes.
      - We entered content in a pre-live environment to demo the site to the client, and they were happy with it.
  tagline: The website of the independent charity protecting Cumbria's landscapes.
  description: WordPress work for Friends of the Lake District, a Cumbrian landscape charity. Gutenberg blocks in PHP and Tailwind CSS, driven by Advanced Custom Fields.
  about:
    - Friends of the Lake District is an independent charity and membership organisation dedicated to protecting Cumbria's landscapes. It began at a public rally in Keswick in 1934, and its campaigning led to the creation of the Lake District National Park in 1951. It also represents the Campaign to Protect Rural England in Cumbria.
    - The website is where that work reaches people. It carries campaigns on issues such as fairer housing and the visitor levy, news, volunteer workparties and events, the land the charity looks after, and the routes to join, donate, volunteer or visit the shop.
- id: skentel
  order: 2
  name: Skentel
  url: https://www.skentel.net
  domain: skentel.net
  sector: IoT remote monitoring
  summary: Page-building components that present a complex service range consistently.
  engagement: hiyield
  images:
    - src: ../assets/clients/skentel-home.jpg
      alt: The Skentel home page, with a green network globe beside the headline Clever connectivity for sustainable futures.
    - src: ../assets/clients/skentel-inner.jpg
      alt: The Skentel case studies page, with links to each sector above photos of leisure and hospitality customers.
  tagline: The website of a Cornish remote monitoring company.
  description: WordPress work for Skentel, a remote monitoring company in Cornwall. Gutenberg blocks in PHP and Tailwind CSS, driven by Advanced Custom Fields.
  about:
    - Skentel designs, installs and manages remote monitoring systems, helping organisations save the time, cost and resources spent travelling out to remote assets. Based in Bodmin, Cornwall, it has worked in remote monitoring since 2009, and rebranded from Ver Fácil in 2025.
    - Each system combines sensor devices, secure connectivity from cellular and LoRaWAN to direct-to-satellite, and a cloud platform. The website explains this to customers in leisure and hospitality, agriculture and the environment, and energy and facilities management, through sector pages, a walkthrough of the process and technology, case studies and resources.
