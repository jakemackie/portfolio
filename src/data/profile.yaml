    - I'm a full-stack developer based in Penzance. I spent two years at <a class="link" href="https://hiyield.co.uk/?utm_source=jakemackie.dev&amp;utm_medium=referral&amp;utm_campaign=portfolio">Hiyield</a>, a B Corp digital agency in Truro, on a small Agile WordPress team, working on sites for more than 25 clients, from charities to B2B tech firms.
