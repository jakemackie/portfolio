    - I came through the apprenticeship route, starting with a BTEC and T Level at Truro and Penwith College, and completed the Level 4 Software Developer apprenticeship, which was graded Distinction. Before that I spent a year on placement with Cornwall IT Services, the IT provider for the NHS in Cornwall.
